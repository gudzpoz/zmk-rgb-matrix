# Same runtime knobs as the preview harness: capture driver + --capture, a
# matrix that stays lit, no persistence. Triggers are on so the Caps Lock
# scenario exercises the table's per-tick sampling.

CONFIG_KEYPAW_SIM_CAPTURE=y
CONFIG_KEYPAW_RGB_MATRIX_AUTO_OFF_IDLE=n
CONFIG_KEYPAW_RGB_TRIGGERS=y
CONFIG_SETTINGS=n
CONFIG_TEST_RANDOM_GENERATOR=y
