# Capture driver + --effect/--capture options.
CONFIG_KEYPAW_SIM_CAPTURE=y

# Keep the matrix lit for the whole run: with this on, an idle keyboard blanks
# the LEDs after the idle timeout and the capture would end in black frames.
CONFIG_KEYPAW_RGB_MATRIX_AUTO_OFF_IDLE=n

# No trigger table in the fixture, and the harness drives effects directly.
CONFIG_KEYPAW_RGB_TRIGGERS=n

# Nothing should be able to restore a persisted effect over --effect. This is
# already the ARCH_POSIX default; stated explicitly for determinism.
CONFIG_SETTINGS=n

# The rain, starlight and digital-rain effects call sys_rand_get(), and
# native_sim has no entropy driver, so allow the timer-based pseudo-random
# generator. Deterministic per run, which is what previews want.
CONFIG_TEST_RANDOM_GENERATOR=y
