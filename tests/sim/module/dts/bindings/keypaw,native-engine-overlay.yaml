description: Scripted native overlay for lifecycle, composition and scheduling contracts.
compatible: "keypaw,native-engine-overlay"
include: [base.yaml, "keypaw,rgb-overlay-common.yaml", behavior-metadata.yaml]
properties:
  condition:
    type: phandle
  slot:
    type: int
    required: true
  filter:
    type: boolean
  test-behavior:
    type: boolean
  "#binding-cells":
    type: int
