description: Native control contract effect
compatible: "test,rgb-control-probe"
include: "keypaw,rgb-matrix-effect-common.yaml"
properties:
  axis:
    type: string
    default: "none"
    enum: ["none", "vertical", "horizontal"]
  mode:
    type: string
    default: "pulse"
    enum: ["idle", "pulse", "sweep"]
  zephyr,deferred-init:
    type: boolean
