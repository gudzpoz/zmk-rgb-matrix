description: |
  Battery gauge using this half's state of charge. Bar mode paints a positional
  level bar; hue mode paints every target with a charge-dependent hue.
  Without battery reporting, the charge is treated as zero.

compatible: "keypaw,rgb-overlay-battery"

include: ["keypaw,rgb-overlay-common.yaml"]

properties:
  mode:
    type: string
    default: "bar"
    enum: ["bar", "hue"]
    description: |
      Bar uses color, background-color and reverse; hue ignores those properties.
      Hue uses hue-empty and hue-full; bar ignores those properties.

  hue-empty:
    type: int
    default: 0
    description: |
      Hue at 0% charge, in degrees (0..359). Hue mode interpolates directly
      between the numeric endpoints, not along the shortest path around the
      wheel, at full saturation and brightness before opacity is applied.

  hue-full:
    type: int
    default: 120
    description: Hue at 100% charge, in degrees (0..359).

  condition:
    type: phandle
    required: false
    description: |
      Predicate that gates the gauge; omit for always active. Usually a
      keypaw,rgb-condition-latch so a key can toggle it.

  color:
    type: int
    required: false
    default: 0x00FF00
    description: 24-bit 0xRRGGBB colour of the lit portion of the bar.

  background-color:
    type: int
    required: false
    default: 0x000000
    description: 24-bit 0xRRGGBB colour of the unlit portion of the bar.

  reverse:
    type: boolean
    description: |
      Fill from the opposite end of the derived reading order. The order sorts
      along the target LEDs' longer axis first (left-to-right for a wide half or
      a wide row), then along the other axis.
