description: |
  Battery-gauge overlay: paints a positional level bar from this half's battery
  state of charge, blending the lit part over its target LEDs and the rest
  toward black, so the bar keeps a defined empty track.

  Each half reads its own charge in the renderer, which runs on that half.

compatible: "keypaw,rgb-overlay-battery"

include: ["keypaw,rgb-overlay-common.yaml"]

properties:
  condition:
    type: phandle
    required: false
    description: |
      Predicate that gates the gauge; omit for always active. Usually a
      keypaw,rgb-condition-latch so a key can toggle it.

  color:
    type: int
    required: false
    default: 0x00FF00
    description: 24-bit 0xRRGGBB colour of the lit portion of the bar.

  background-color:
    type: int
    required: false
    default: 0x000000
    description: 24-bit 0xRRGGBB colour of the unlit portion of the bar.

  reverse:
    type: boolean
    description: |
      Fill from the opposite end of the derived reading order. The order sorts
      along the target LEDs' longer axis first (left-to-right for a wide half or
      a wide row), then along the other axis.
