description: Addressed RGB effect-selector control

compatible: "keypaw,behavior-rgb-selector"

include: two_param.yaml

properties:
  selector:
    type: phandle
    required: true
    description: |
      Enabled keypaw,rgb-overlay-selector controlled by this behavior. Each
      selector must have exactly one enabled control. The behavior's device
      name must fit eight characters; the selector's name has no such limit.
      Accepts RGB effect, hue/saturation, duration and RGB_RESET commands.
      RGB_RESET restores only this selector's defaults. Power and master
      brightness commands belong to keypaw,behavior-rgb-matrix.
