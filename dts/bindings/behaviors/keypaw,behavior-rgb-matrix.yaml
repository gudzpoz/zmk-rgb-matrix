description: Global RGB matrix control facade (single instance)

compatible: "keypaw,behavior-rgb-matrix"

include: two_param.yaml

properties:
  selector:
    type: phandle
    description: |
      Explicit selector alias for selection, hue/saturation and duration commands.
      Must reference an enabled keypaw,rgb-overlay-selector with a canonical
      keypaw,behavior-rgb-selector control. Power, brightness and reset stay global.
