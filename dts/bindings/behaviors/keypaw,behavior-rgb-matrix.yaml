description: Keypaw RGB Matrix control

compatible: "keypaw,behavior-rgb-matrix"

include: two_param.yaml

properties:
  leds:
    type: array
    required: false
    description: |
      Local LED chain indices owned by this behavior. Entries must be unique
      and within the strip chain length. When omitted, this behavior owns the
      complete physical matrix for backward compatibility; multiple behaviors
      therefore must provide disjoint `leds` lists.

  overlays:
    type: phandles
    required: false
    description: |
      Overlays composited over this behavior's active effect, in paint order.
      An effect may replace this list with its own `overlays` property or opt
      out with `no-overlays`.
  max-brightness:
    type: int
    default: 40
    description: Capped RGB brightness in percent (0..100).

  idle-brightness:
    type: int
    default: 30
    description: |
      RGB brightness in percent (0..100) to use while the keyboard is idle
      (ZMK activity not ACTIVE). Only observable with
      CONFIG_KEYPAW_RGB_MATRIX_AUTO_OFF_IDLE=n, which keeps the LEDs on instead
      of turning them off when idle.

  initial-brightness:
    type: int
    default: 30
    description: Initial brightness in percent (0..100).

  initial-duration-ms:
    type: int
    default: 1000
    description: |
      Animation period, in milliseconds, given at boot to every effect that does
      not set its own `duration`. Clamped to
      CONFIG_KEYPAW_RGB_MATRIX_DURATION_{MIN,MAX}_MS, so it is never zero.

  initial-effect:
    type: int
    default: 0
    description: Initial effect index; falls back to the first registered effect if absent.

  initial-on:
    type: boolean
    description: |
      Start the matrix enabled. A boolean cannot carry `default:` (edtlib
      rejects that), so the driver treats the property as "enabled unless
      explicitly set to false".
