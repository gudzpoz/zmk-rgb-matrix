description: Reactive keypress fade RGB matrix effect.
compatible: "keypaw,rgb-matrix-reactive"
include: [zero_param.yaml, "keypaw,rgb-matrix-effect-common.yaml"]

properties:
  background-brightness:
    type: int
    required: false
    default: 10
    description: |
      Brightness (percent of the effect colour) of an LED whose key is not
      pressed. Effect local: this is not the keyboard-wide idle brightness,
      which lives on the &kprgb node as `idle-brightness`.
