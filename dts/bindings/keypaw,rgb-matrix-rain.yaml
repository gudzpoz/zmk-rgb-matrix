description: |
  Randomly lit keys with random colours, covering QMK's PIXEL_RAIN, PIXEL_FLOW,
  RAINDROPS, JELLYBEAN_RAINDROPS and PIXEL_FRACTAL via the `mode` attribute.
compatible: "keypaw,rgb-matrix-rain"
include: [zero_param.yaml, "keypaw,rgb-matrix-effect-common.yaml"]

properties:
  mode:
    type: string
    required: false
    default: "pixel"
    enum: ["pixel", "flow", "drops", "jellybean", "fractal"]
    description: |
      "pixel" lights random keys with random hues (PIXEL_RAIN), "jellybean" also
      randomises saturation (JELLYBEAN_RAINDROPS), "flow" runs a cursor along the
      LED chain with random hues (PIXEL_FLOW), "fractal" pulses a single hue
      outward from the board centre (PIXEL_FRACTAL), and "drops" nudges one
      random key's hue each step while the rest of the board stays lit
      (RAINDROPS).

      Unlike every other mode, "drops" never turns an LED off, and it keeps the
      preset's saturation while varying only the hue. It therefore needs a
      saturated `color` to be visible: with a white preset every key renders as
      the same white and the effect looks static.

  step-interval-ms:
    type: int
    default: 32
    description: |
      Interval in milliseconds, from 1 to 65535, between random spawn attempts
      in pixel/jellybean mode or cursor advances in flow mode. Each spawn attempt
      has a 35% chance of lighting one random LED; a spawn is not guaranteed.
      This interval is independent of render cadence. Duration controls fading.
      Ignored by drops (64 hue nudges per duration) and fractal (one phase cycle
      per duration). At most eight due attempts/advances/nudges are processed per
      render; excess opportunities are skipped, but fading and fractal phase
      still consume the full elapsed time.
