# Shared properties for every RGB matrix overlay. Overlay kinds (cores in this
# module or in a third-party one) include this fragment and add only the
# properties specific to the state they show, the same way effects include
# keypaw,rgb-matrix-effect-common.yaml.
#
# `keys`, `leds`, `all-leds` and `opacity` are the paint contract -- which LEDs
# the overlay targets and how it blends onto them. `local` is the one property
# here that is not about painting: it says where the overlay's gate is
# evaluated. It stays on the overlay rather than on the condition because the
# split push is per-overlay -- a condition has no ordinal and no state of its
# own, and one condition is shared by overlays and by the central-only trigger
# table, which has no notion of locality.

properties:
  keys:
    type: array
    required: false
    description: |
      Key positions in the zmk,physical-layout whose LEDs this overlay paints.
      Resolved through the same mapping the effects use, so one list works on
      both halves. An overlay with neither `keys` nor `leds` targets no LEDs
      and stays dark; a kind that wants a different empty-list meaning can read
      the empty list itself (KP_LED_COUNT is available to kinds).

  leds:
    type: array
    required: false
    description: |
      Raw WS2812 chain indices, for LEDs that are not under a key (the
      KP_RGB_NO_KEY entries in `mapping`).

  all-leds:
    type: boolean
    description: |
      Paint every LED on the half, instead of resolving `keys`/`leds`. Do not
      combine it with either.

      Combined with `opacity` 100 this asserts the overlay *fully replaces*
      every LED, so the engine skips rendering the active effect and any overlay
      below (earlier than) this one: they cannot be seen. A kind must honour that
      promise -- the built-in `keypaw,rgb-overlay` compositor does -- or it will
      flash a stale frame.

  opacity:
    type: int
    required: false
    default: 100
    description: |
      Blend strength in percent: 100 replaces the underlying pixels on the
      targeted LEDs, lower values mix the composited result over them.

  local:
    type: boolean
    description: |
      Evaluate this overlay's gate -- its `condition`, or a self-sampling
      `active` -- independently on each half, instead of evaluating it once on
      the split central and pushing only the resulting on/off bit. It chooses
      *where the gate runs*, not what is painted: both halves run the renderer,
      so a per-half source read inside it (a battery gauge's own charge) is
      per-half with or without this flag.

      Omit it -- the common case -- to evaluate the condition on the central and
      push the bit to the peripherals; on a peripheral the compositor is then
      gated by that pushed state and never calls the condition.

      Use it only for a condition whose value genuinely differs per half and is
      not kept in step by the split link. None of the built-in conditions
      qualifies: `layer` is central-only, `caps-lock` is a global host source,
      and `latch` is synchronised by its GLOBAL toggle. Getting this wrong is
      silent, so leave it off unless you can name the per-half source.
