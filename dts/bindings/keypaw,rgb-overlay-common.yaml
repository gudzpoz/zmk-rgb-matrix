# Shared properties for every RGB matrix overlay. Overlay kinds (cores in this
# module or in a third-party one) include this fragment and add only the
# properties specific to the state they show, the same way effects include
# keypaw,rgb-matrix-effect-common.yaml.

properties:
  keys:
    type: array
    required: false
    description: |
      Key positions in the zmk,physical-layout whose LEDs this overlay paints.
      Resolved through the same mapping the effects use, so one list works on
      both halves. An overlay with neither `keys` nor `leds` targets no LEDs
      and stays dark; a kind that wants a different empty-list meaning can read
      the empty list itself (KP_LED_COUNT is available to kinds).

  leds:
    type: array
    required: false
    description: |
      Raw WS2812 chain indices, for LEDs that are not under a key (the
      KP_RGB_NO_KEY entries in `mapping`).

  opacity:
    type: int
    required: false
    default: 100
    description: |
      Blend strength in percent: 100 replaces the underlying pixels on the
      targeted LEDs, lower values mix the composited result over them.

  local:
    type: boolean
    description: |
      Evaluate this overlay's condition independently on each half, so each half
      shows its own state (a battery bar, per-half activity). The condition must
      then be truthful on a peripheral too, and the engine calls it there.

      Omit it -- the common case -- to evaluate the condition once on the split
      central and push the resulting on/off bit to the peripherals. On a
      peripheral the compositor is then gated by that pushed state and never
      calls the condition.

      A condition evaluated only this way is a *view* of central state; use
      `local` for state that genuinely differs per half.
