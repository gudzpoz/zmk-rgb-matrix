description: |
  Position-aware RGB LED matrix.

  Every LED carries an (x, y) position in the same units as the
  zmk,physical-layout (keypaw48: 100 = one key width) plus the key position it
  sits under. That is what lets effects use real geometry instead of treating
  the strip as an unnamed line.

  This singleton is also the global two-parameter behavior for power, master
  brightness and reset. Its effective device name must be at most eight
  characters and match on both split halves.

  Direct children are overlays in composition order. Their child indices,
  including disabled children, address gate bits on the split link. Keep the
  same child order on both halves. Conditions, triggers and selector controls
  belong outside this node; effects belong under their overlay owners.

compatible: "keypaw,rgb-matrix"

include: two_param.yaml

properties:

  strip:
    type: phandle
    required: false
    description: |
      The physical or composite LED strip device driving this half's LEDs.
      Omit it when the half has no local LEDs (a USB-dongle central): nothing
      is rendered and "mapping" must then be empty. When present, its
      chain-length is the single source of truth for the LED count and the
      "mapping" length must agree with it.

  physical-layout:
    type: phandle
    required: true
    description: |
      The zmk,physical-layout node whose key attributes are used to place every
      per-key LED. A "mapping" entry that is a plain integer is treated as a key
      position into this layout; the LED's (x, y) centre is computed from the
      key's (x, y, width, height). LEDs not under a key use KP_RGB_NO_KEY(x, y)
      in the "mapping" instead.

  mapping:
    type: array
    required: true
    description: |
      Flat array, one entry per LED, in WS2812 chain order. Each entry is
      either a global key position (0..N-1) whose keycap sits above the LED --
      its centre is derived from "physical-layout" -- or KP_RGB_NO_KEY(x, y)
      for an LED not under a key (an edge/underglow LED) carrying explicit (x,
      y) coordinates in physical-layout units (100 = one key width). Length
      must equal the chain-length of "strip", and is empty when "strip" is
      omitted.

  max-brightness:
    type: int
    default: 40
    description: Capped RGB brightness in percent (0..100).

  idle-brightness:
    type: int
    default: 30
    description: |
      RGB brightness in percent (0..100) to use while the keyboard is idle
      (ZMK activity not ACTIVE). Only observable with
      CONFIG_KEYPAW_RGB_MATRIX_AUTO_OFF_IDLE=n, which keeps the LEDs on instead
      of turning them off when idle.

  initial-brightness:
    type: int
    default: 30
    description: Initial brightness in percent (0..100).

  initial-on:
    type: boolean
    description: Start the matrix enabled; omit to start disabled.
