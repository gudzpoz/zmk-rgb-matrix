description: |
  Container for RGB matrix condition nodes. A condition is a reusable predicate
  consumed by overlays (`condition = <&...>`) and by triggers, so one definition
  -- a keymap layer, Caps Lock, an always-on predicate -- serves every consumer
  instead of each reimplementing it.

  The node itself is not a device and has no driver; it groups conditions for
  readability. Conditions have no persisted or split identity. Providers may
  keep volatile state and must notify after coherent source changes. Conditions
  are sampled initially and again on explicit source/dependency invalidation or
  engine refreshes; there is no timed polling. Consumers read cached snapshots. A
  central-evaluated overlay pushes only its resulting on/off bit; a local overlay
  evaluates a tree whose sources must support that half.

compatible: "keypaw,rgb-conditions"
