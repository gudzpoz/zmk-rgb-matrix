properties:
  color:
    type: int
    required: false
    default: 0xFFFFFF
    description: 24-bit RGB preset colour.

  duration:
    type: int
    required: false
    default: 0
    description: |
      Animation period in milliseconds; shorter means faster. Zero (the default)
      uses the owning controller or selector's `initial-duration-ms` for selectable
      effects, or 1000 ms for effects owned by other providers.

  persist-id:
    type: string
    required: false
    description: |
      Opts this selectable effect's hue, saturation and duration into persistence.
      Selection always uses this ID, or the full node name when omitted.
      Selector members require 1..31 ASCII letters, digits, underscores, hyphens,
      dots or '@'; IDs must be unique among enabled children of the same selector.
      Identical IDs in different selectors are valid. For opted-in parameters,
      the selector ID plus this ID must contain at most 27 characters to fit
      Zephyr's 64-character settings key limit. Legacy flat-controller effects
      retain their identifier-compatible, globally unique ID contract.

  overlays:
    type: phandles
    required: false
    description: |
      Controller-selectable effects only. Overlay list to paint while this effect is
      active, replacing the default of every registered overlay in
      `rgb_overlays` declaration order. A devicetree array cannot be empty, so
      use `no-overlays;` for an effect that wants none. Entries must be unique
      within this list. The same overlay may be included in different selectable
      effects' lists.

  no-overlays:
    type: boolean
    description: |
      Draw no overlays at all for this effect. Allowed only on controller-selectable
      effects, not effects owned by other providers.
