include: [base.yaml]
properties:
  color:
    type: int
    required: false
    default: 0xFFFFFF
    description: 24-bit RGB preset colour.

  duration:
    type: int
    required: false
    default: 0
    description: |
      Animation period in milliseconds; shorter means faster. Zero uses the
      common 1000 ms fallback. The resulting default is clamped to the configured
      duration bounds before the effect device is initialized.
