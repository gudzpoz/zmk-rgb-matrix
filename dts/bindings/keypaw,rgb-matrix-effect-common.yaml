properties:
  color:
    type: int
    required: false
    default: 0xFFFFFF
    description: 24-bit RGB preset colour.

  duration:
    type: int
    required: false
    default: 0
    description: |
      Animation period in milliseconds; shorter means faster. Zero (the default)
      uses the controller's `initial-duration-ms` for selectable effects, or
      1000 ms for effects owned by other providers.

  persist-id:
    type: string
    required: false
    description: |
      Opts this selectable effect into persistence. The value is the stable
      settings identity and must be a unique identifier-compatible token.

  overlays:
    type: phandles
    required: false
    description: |
      Selectable effects only. Overlay list to paint while this effect is
      active, replacing the default of every registered overlay in
      `rgb_overlays` declaration order. A devicetree array cannot be empty, so
      use `no-overlays;` for an effect that wants none. Entries must be unique
      within this list. The same overlay may be included in different selectable
      effects' lists.

  no-overlays:
    type: boolean
    description: |
      Draw no overlays at all for this effect. Allowed only on selectable
      effects, not effects owned by other providers.
