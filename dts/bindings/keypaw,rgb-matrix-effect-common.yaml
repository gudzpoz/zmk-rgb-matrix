properties:
  index:
    type: int
    required: true
    description: Unique, stable effect index used on the wire.

  color:
    type: int
    required: false
    default: 0xFFFFFF
    description: 24-bit RGB preset colour.

  duration:
    type: int
    required: false
    default: 0
    description: |
      Animation period in milliseconds; shorter means faster. Zero (the default)
      takes the &kprgb node's `initial-duration-ms`.

  indicators:
    type: phandles
    required: false
    description: |
      Indicator list to use while this effect is active, replacing the one on the
      &rgb_matrix node. A devicetree array cannot be empty, so use
      `no-indicators;` for an effect that wants none.

  no-indicators:
    type: boolean
    description: |
      Draw no indicators at all for this effect. Only meaningful for effects that
      would otherwise inherit the matrix-wide list.
