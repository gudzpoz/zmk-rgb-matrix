properties:
  color:
    type: int
    required: false
    default: 0xFFFFFF
    description: 24-bit RGB preset colour.

  duration:
    type: int
    required: false
    default: 0
    description: |
      Animation period in milliseconds; shorter means faster. Zero (the default)
      uses the controller's `initial-duration-ms` for selectable effects, or
      1000 ms for private overlay effects.

  overlays:
    type: phandles
    required: false
    description: |
      Overlay list to paint while this effect is active, replacing the default
      of every registered overlay in `rgb_overlays` declaration order. A
      devicetree array cannot be empty, so use `no-overlays;` for an effect
      that wants none. Entries must be unique within this list. The same overlay
      may be included in different selectable effects' lists.

  no-overlays:
    type: boolean
    description: |
      Draw no overlays at all for this effect. Allowed only on selectable
      effects, not private overlay effects.

  no-cycle:
    type: boolean
    description: |
      Skip this effect when cycling with RGB_EFF/RGB_EFR. Explicit selection still
      works (RGB_EFS, a trigger, `initial-effect`). Use on variants that are only
      meant to be reached from a trigger, so they do not clutter the cycle.
