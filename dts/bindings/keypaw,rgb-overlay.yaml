description: |
  Generic RGB matrix overlay: a compositor. While its condition is active it
  renders exactly one effect and blends the result onto the targeted LEDs, over
  whatever the active effect painted.

  Declare exactly one enabled effect child of this node. It is a private
  preset: not selectable, not persisted, and unaffected by the controller's
  hue/brightness/duration commands.

compatible: "keypaw,rgb-overlay"

include: ["keypaw,rgb-overlay-common.yaml"]

properties:
  condition:
    type: phandle
    required: false
    description: |
      Predicate (a keypaw,rgb-condition-* node) that gates the compositor.
      Omit it for an overlay that composites unconditionally.
