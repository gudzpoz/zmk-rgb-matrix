description: |
  Ordered RGB condition-edge rules. Children execute in declaration order on
  the split central or standalone device, never on a split peripheral.
  Startup actions run after provider readiness, RGB defaults, and settings
  restoration. Conditions are sampled predicates, not lossless event queues.

compatible: "keypaw,rgb-trigger-table"

child-binding:
  description: |
    Independent actions on condition edges. At least one of on-enter and on-exit
    must contain a binding. Each action receives one pressed invocation; no
    matching release is sent. Use only behaviors that complete without a release,
    including third-party one-shot behaviors. The user must ensure this; action
    targets are not restricted to an allowlist. on-exit invokes its own actions,
    not releases for on-enter actions. Global commands use central conversion and
    split transport once. Invalid condition snapshots disable the rule without an
    exit action. Initially true conditions invoke on-enter; initially false
    conditions invoke nothing. All rules use one cached condition pass; action-driven
    source changes take effect in a subsequent queued pass, without rollback of
    earlier actions. Rules must not form feedback loops, and condition samples must
    be side-effect-free and must not synchronously invalidate conditions. Runtime
    feedback detection, pass limits and quarantine are not provided.
  properties:
    condition:
      type: phandle
      description: |
        Cached condition predicate. Absent means constant true, so startup
        invokes on-enter once and on-exit never runs.
    on-enter:
      type: phandle-array
      specifier-space: binding
      description: |
        Commands invoked in order on false-to-true edges. Relative RGB commands
        are converted to absolute values centrally before global dispatch.
    on-exit:
      type: phandle-array
      specifier-space: binding
      description: Commands invoked in order on true-to-false edges.
