description: |
  Ordered RGB condition-edge rules. Children execute in declaration order on
  the split central or standalone device, never on a split peripheral.
  Startup actions run after provider readiness, RGB defaults, and settings
  restoration. Conditions are sampled predicates, not lossless event queues.

compatible: "keypaw,rgb-trigger-table"

child-binding:
  description: |
    Independent one-shot RGB actions on condition edges. At least one of
    on-enter and on-exit must contain a binding. Supported targets are RGB
    controllers, registered RGB effect behaviors, and RGB latch behaviors;
    arbitrary keyboard behaviors and held presses are not supported.
    Both lists invoke commands, not key-release handlers. Global commands use
    central conversion and split transport once. Invalid condition snapshots
    disable the rule without an exit action. Unsettled feedback chains are
    limited to eight passes and participating rules are disabled until reboot.
  properties:
    condition:
      type: phandle
      description: |
        Cached condition predicate. Absent means constant true, so default
        startup invokes on-enter once and on-exit never runs.
    on-enter:
      type: phandle-array
      specifier-space: binding
      description: |
        Commands invoked in order on false-to-true edges. Relative RGB commands
        are converted to absolute values centrally before global dispatch.
    on-exit:
      type: phandle-array
      specifier-space: binding
      description: Commands invoked in order on true-to-false edges.
    startup:
      type: string
      default: "enter-if-active"
      enum:
        - "enter-if-active"
        - "baseline"
      description: |
        enter-if-active invokes on-enter for an initially true predicate;
        initially false predicates invoke nothing. baseline records the initial
        value without executing either list. Subsequent edges behave identically.
