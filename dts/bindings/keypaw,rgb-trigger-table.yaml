description: |
  RGB matrix trigger table: the ordered rules that map a condition (a keymap
  layer, and later idle/caps-lock) to RGB commands.

  This is a plain grouping node with no driver. Its children are the triggers,
  and their DECLARATION ORDER is the precedence order -- the first whose
  condition is active wins. There is deliberately no `triggers` phandle list:
  edtlib makes every node depend on its parent (edtlib.py "A Node always depends
  on its parent"), so a parent pointing at its own child is a 2-cycle, and
  gen_defines then assigns both nodes an ordinal of -1, which breaks the
  DEVICE_DT_NAME_GET predeclaration in <zephyr/device.h>.

compatible: "keypaw,rgb-trigger-table"
