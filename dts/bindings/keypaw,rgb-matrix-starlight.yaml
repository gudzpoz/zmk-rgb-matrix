description: |
  LEDs turn on and off at random at varying brightness, keeping the user colour
  (with optional hue/sat jitter). Covers QMK's STARLIGHT, STARLIGHT_SMOOTH,
  STARLIGHT_DUAL_HUE and STARLIGHT_DUAL_SAT.
compatible: "keypaw,rgb-matrix-starlight"
include: [zero_param.yaml, "keypaw,rgb-matrix-effect-common.yaml"]

properties:
  step-interval-ms:
    type: int
    default: 32
    description: |
      Interval in milliseconds (1..65535) between independent per-LED trials
      with a 4% probability of changing the target brightness, not guaranteed
      changes. Independent of renderer cadence; duration controls the smooth
      brightness fade. At most eight trials run per render; excess trials are
      skipped without discarding elapsed fade time.

  smooth:
    type: boolean
    required: false
    description: |
      Ramp brightness up and down instead of switching instantly
      (STARLIGHT_SMOOTH).

  dual-hue:
    type: boolean
    required: false
    description: |
      Jitter each lit LED's hue by +/-30 (STARLIGHT_DUAL_HUE).

  dual-sat:
    type: boolean
    required: false
    description: |
      Jitter each lit LED's saturation by +/-30 (STARLIGHT_DUAL_SAT).
